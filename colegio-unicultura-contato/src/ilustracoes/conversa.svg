<svg class="un-talk" viewBox="0 0 520 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração: celular com uma conversa, envelope e telefone">
  <circle cx="260" cy="240" r="200" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <circle cx="260" cy="240" r="150" fill="#FFFFFF" fill-opacity=".04"/>
  <!-- celular -->
  <g class="un-talk-phone">
    <rect x="160" y="60" width="200" height="370" rx="34" fill="#FFFFFF"/>
    <rect x="172" y="74" width="176" height="342" rx="24" fill="#EDEEFA"/>
    <rect x="228" y="82" width="64" height="10" rx="5" fill="#FFFFFF"/>
    <circle cx="200" cy="122" r="14" fill="#F10505"/>
    <text x="222" y="118" fill="#010658" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="800">Unicultura</text>
    <text x="222" y="133" fill="#42468D" font-family="Hanken Grotesk, sans-serif" font-size="10" font-weight="600">online agora</text>
    <line x1="182" y1="148" x2="338" y2="148" stroke="#010658" stroke-opacity=".1"/>
    <g class="un-msg un-msg--1"><rect x="184" y="164" width="124" height="40" rx="14" fill="#FFFFFF"/>
      <text x="198" y="189" fill="#010658" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">Olá! Como posso</text></g>
    <g class="un-msg un-msg--2"><rect x="184" y="210" width="96" height="30" rx="14" fill="#FFFFFF"/>
      <text x="198" y="230" fill="#010658" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">ajudar?</text></g>
    <g class="un-msg un-msg--3"><rect x="212" y="252" width="124" height="40" rx="14" fill="#010658"/>
      <text x="226" y="277" fill="#FFFFFF" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">Quero agendar</text></g>
    <g class="un-msg un-msg--4"><rect x="250" y="298" width="86" height="30" rx="14" fill="#010658"/>
      <text x="264" y="318" fill="#FFFFFF" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">uma visita!</text></g>
    <g class="un-typing"><rect x="184" y="340" width="64" height="30" rx="14" fill="#FFFFFF"/>
      <circle class="un-dot1" cx="202" cy="355" r="4" fill="#42468D"/><circle class="un-dot2" cx="216" cy="355" r="4" fill="#42468D"/><circle class="un-dot3" cx="230" cy="355" r="4" fill="#42468D"/></g>
    <rect x="184" y="384" width="152" height="22" rx="11" fill="#FFFFFF"/>
    <circle cx="324" cy="395" r="8" fill="#F10505"/>
  </g>
  <!-- envelope -->
  <g class="un-float-a">
    <rect x="48" y="118" width="96" height="66" rx="12" fill="#FFB867"/>
    <path d="M52 124 L96 158 L140 124" fill="none" stroke="#010658" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- telefone com ondas -->
  <g class="un-float-b">
    <circle cx="430" cy="332" r="38" fill="#F10505"/>
    <path d="M414 318 c 2 -4 8 -4 10 0 l 4 8 c 1 3 0 6 -3 7 l -4 2 c 3 7 8 12 15 15 l 2 -4 c 1 -3 4 -4 7 -3 l 8 4 c 4 2 4 8 0 10 c -6 4 -14 5 -22 1 c -12 -6 -21 -15 -27 -27 c -4 -8 -3 -16 1 -22 z" fill="#FFFFFF"/>
    <path class="un-wave1" d="M462 304 a 34 34 0 0 1 0 56" fill="none" stroke="#FFB867" stroke-width="4" stroke-linecap="round"/>
    <path class="un-wave2" d="M476 292 a 50 50 0 0 1 0 80" fill="none" stroke="#FFB867" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- pin -->
  <g class="un-float-c">
    <path d="M90 300 c 0 -20 16 -34 34 -34 s 34 14 34 34 c 0 26 -34 58 -34 58 s -34 -32 -34 -58 z" fill="#FFFFFF"/>
    <circle cx="124" cy="300" r="12" fill="#F10505"/>
  </g>
</svg>
